<body class="b-page__1">
    
    <h1>ВОЗМОЖНОСТИ</h1>
    <div class="rtu-blok-1">
    <div class="b-company">
    <figure><div class="b-company__header">
            <div class="b-item-head">
                <div class="b-item-head__text">БЕЗ ПРОВОДОВ</div>
            </div>
        </div>
        <div class="b-company__content">
            <div class="b-content">
                <figcaption><img class="b-content__img" src="assets/img/Illustration_4.png" alt="ученый"></figcaption>
                <div class="b-content__text">Шлем работает без проводов. <br> Не нужен ни компьютер, <br>ни внешнее питание, ни большое <br>помещение, чтобы расставить <br>трекеры.</div>
            </div>
        </div></figure>
    </div>
    <div class="b-company__1">
        <figure><div class="b-company__header">
            <div class="b-item-head">
                <div class="b-item-head__text_1">БЕЗ КОМПЬЮТЕРА</div>
            </div>
        </div>
        <div class="b-company__content">
            <div class="b-content">
                <figcaption><img class="b-content__img_1" src="assets/img/Illustration_2.png" alt="робот"></figcaption>
                <div class="b-content__text">Современным VR-шлемам нужен<br>мощный компьютер, чтобы<br>запускать игры. Наш шлем<br>запускает игры из облака, поэтому<br>просто наслаждайтесь.</div>
            </div>
        </div></figure>
        </div>
        <div class="b-company__2">
            <figure><div class="b-company__header">
                <div class="b-item-head">
                    <div class="b-item-head__text_2">ДО 10 ЧАСОВ РАБОТЫ</div>
                </div>
            </div>
            <div class="b-company__content">
                <div class="b-content">
                    <figcaption><img class="b-content__img_2" src="assets/img/Illustration_9.png" alt="card_student"></figcaption>
                    <div class="b-content__text">Несмотря на компактность<br>и производительность, шлем<br>может работать до 10 часов-даже<br>если вы играете в самые<br>ресурсоемкие игры.</div>
                </div>
            </div></figure>
    </div>
</div>
</div>



<div class="rtu-blok-2">
    <div class="b-company__3">
    <figure><div class="b-company__header">
            <div class="b-item-head">
                <div class="b-item-head__text_3">СОТНИ ИГР</div>
            </div>
        </div>
        <div class="b-company__content">
            <div class="b-content">
                <div class="b-content__text">Уже сейчас вам доступно более<br>сотни игр от высокобюджетных<br>ААА тайтлов до маленьких<br>независимых проектов. Скоро<br>их станет ещё больше.</div>
            </div>
        </div></figure>
    </div>
    
        <div class="b-company__4">
            <figure><div class="b-company__header">
                    <div class="b-item-head">
                        <div class="b-item-head__text_3">ПОЧТИ ДАРОМ</div>
                    </div>
                </div>
                <div class="b-company__content">
                    <div class="b-content">
                        <div class="b-content__text">По сравнению с другими<br>VR-шлемами наш стоит гораздо<br>меньше. И вы существенно<br>экономите на мощном компьютере.</div>
                    </div>
                </div></figure>
            </div>
            <div class="image_text_container">
                <img src="assets/img/Rectangle 12.png" alt="розовый прямоугольник">

                </figure>
                <img src="assets/img/button.png" alt="кнопка подписаться" class="button">
